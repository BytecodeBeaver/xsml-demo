meta:
  type: "xsml"
  version: "0.1.0"
mission:
  id: hardening_linux
  title: "Zidentyfikowanie potencjalnych luk bezpieczeństwa w systemie Linux"
  description: "Celem misji jest określenie jakie elementy funkcjonują w systemie i jak można je uszczelnić"
  worldstate:
    firewall_enabled: false
  inventory: {}

  goals:
    - id: "complete_hardening_of_linux_system"
      description: "Zlokalizowano i utwardzono wszystkie dziury bezpieczeństwa systemu"
      requires:
        inventory: {}
        worldstate: {}
      subgoals:
        - id: "set_strong_root_password"
          description: "Ustalono silne hasło dla użytkownika root"
          requires:
            inventory:
              changed_root_password: true
            worldstate: {}
          subgoals:
            - id: "identify_weak_root_password"
              description: "Zidentyfikowano słabe hasło użytkownika"
              requires:
                inventory:
                  weak_user_password_detected: true
                worldstate: {}

        - id: "enable_firewall"
          description: "Usługa zapory sieciowej została uruchomiona"
          requires:
            inventory: {}
            worldstate:
              firewall_enabled: true
          subgoals:
            - id: "firewall_disabled_detected"
              description: "Ustalono, że usługa zapory sieciowej nie jest aktywna"
              requires:
                inventory:
                  firewall_status_checked: true
                worldstate: {}

  actions:
    - id: "check_user_password"
      description: "Sprawdź hasło użytkownika root"
      user_input: "echo /root/root_password.txt"
      requires:
        inventory: {}
        worldstate: {}
      produces:
        - id: "weak_user_password_detected"
          probability: 1.0
          change:
            inventory:
              weak_user_password_detected: true
            worldstate: {}
            inventory_and_worldstate: {}
          simulated_output: |
            root
    - id: "set_strong_root_password"
      description: "Wygeneruj nowe, silne hasło dla użytkownika root"
      user_input: "pwgen -s 8 | tee /dev/tty | passwd -s root"
      requires:
        inventory:
          weak_user_password_detected: true
        worldstate: {}
      produces:
        - id: "changed_password_to_strong_generated_one"
          probability: 1.0
          change:
            inventory: {}
            worldstate: {}
            inventory_and_worldstate:
              changed_root_password: true
          simulated_output: |
            pnFBg9jB8AlKL3fe
    - id: "check_firewall_status"
      description: "Sprawdź stan zapory sieciowej"
      user_input: "systemctl status firewalld.service"
      requires:
        inventory: {}
        worldstate: {}
      produces:
        - id: "firewall_status_checked"
          probability: 1.0
          change:
            inventory: {}
            worldstate: {}
            inventory_and_worldstate:
              firewall_status_checked: true
          simulated_output: |
            ○ firewalld.service - firewalld - dynamic firewall daemon
            Loaded: loaded (/usr/lib/systemd/system/firewalld.service; disabled; preset: enabled)
            Active: inactive (dead)
              Docs: man:firewalld(1)

            sie 27 15:13:30 debian systemd[1]: Starting firewalld.service - firewalld - dynamic firewall daemon...
            sie 27 15:13:31 debian systemd[1]: Started firewalld.service - firewalld - dynamic firewall daemon.
            sie 27 15:13:53 debian systemd[1]: Stopping firewalld.service - firewalld - dynamic firewall daemon...
            sie 27 15:13:53 debian systemd[1]: firewalld.service: Deactivated successfully.
            sie 27 15:13:53 debian systemd[1]: Stopped firewalld.service - firewalld - dynamic firewall daemon.
    - id: "enable_firewall"
      description: "Uruchom usługę zapory sieciowej"
      user_input: "systemctl enable firewalld.service --now"
      requires:
        inventory:
          firewall_status_checked: true
        worldstate:
          firewall_enabled: false
      produces:
        - id: "firewall_enabled"
          probability: 1.0
          change:
            inventory: {}
            worldstate: {}
            inventory_and_worldstate:
              firewall_enabled: true
          simulated_output: |
            Created symlink /etc/systemd/system/multi-user.target.wants/firewalld.service → /lib/systemd/system/firewalld.service.
  support:
    - id: "getting_started_1"
      hint: "Sprawdź dostępne akcje, może warto sprawdzić hasło użytkownika root?"
      requires:
        inventory:
          player_idle_time: 15
          weak_user_password_detected: false
        worldstate: {}
    - id: "getting_started_2"
      hint: "Sprawdź dostępne akcje, może warto sprawdzić stan zapory sieciowej?"
      requires:
        inventory:
          player_idle_time: 15
          firewall_status_checked: false
        worldstate: {}
    - id: "suggest_password_change"
      hint: "Hasło użytkownika root jest słabe, co możesz teraz zrobić?"
      requires:
        inventory:
          player_idle_time: 15
          weak_user_password_detected: true
          changed_root_password: false
        worldstate: {}
    - id: "suggest_firewall_enable"
      hint: "Zapora sieciowa nie jest aktywna, co możesz teraz zrobić?"
      requires:
        inventory:
          player_idle_time: 15
          firewall_status_checked: true
        worldstate:
          firewall_enabled: false
  scenarios:
    - id: "linux_hardening_walkthrough"
      goal: "complete_hardening_of_linux_system"
      nodes:
        start:
          id: "start"
          description: "Rozpoczęto analizę bezpieczeństwa systemu Linux"
        password_checked:
          id: "password_checked"
          description: "Sprawdzono hasło użytkownika root"
        firewall_checked:
          id: "firewall_checked"
          description: "Sprawdzono stan zapory sieciowej"
        completed:
          id: "completed"
          description: "Zakończono utwardzanie systemu Linux"
      transitions:
        - from: "start"
          to: "password_checked"
          action_trigger: "check_user_password"
        - from: "password_checked"
          to: "firewall_checked"
          action_trigger: "check_firewall_status"
        - from: "firewall_checked"
          to: "completed"
          action_trigger: "enable_firewall"

